query QueryGameCategories($gameId: Int!) {
    categories(gameId: $gameId, global: true) {
        ...Category
    }
}

query QueryGlobalCategories {
    categories(global: true) {
        ...Category
    }
}

query RequestCollectionRevisionUploadUrl {
    collectionRevisionUploadUrl {
        ...PresignedUrl
    }
}

query RequestMediaUploadUrl($mimeType: String!) {
    requestMediaUploadUrl(mimeType: $mimeType) {
        ...PresignedUrl
    }
}

query QueryGameById($id: ID!) {
    game(id: $id) {
        domainName
    }
}

query QueryGameByDomain($domain: String!) {
    game(domainName: $domain) {
        id
    }
}

query QueryMod($modId: Int!, $gameId: Int!)
{
    legacyMods(ids: [{gameId: $gameId, modId: $modId}])
    {
        nodes
        {
            ...Mod
        }
    }
}

query QueryMods($ids: [CompositeIdInput!]!, $modCount: Int!)
{
    legacyMods(ids: $ids, count: $modCount)
    {
        nodes
        {
            ...Mod
        }
    }
}

query QueryModFile($uid: ID!) {
    modFilesByUid(uids: [$uid]) {
        nodes {
            ...ModFile
        }
    }
}

query QueryModFiles($modId: ID!, $gameId: ID!) {
    modFiles(modId: $modId, gameId: $gameId) {
        ...ModFile
    }
}

# There is no field that lists the files of several mods, so this asks for ten mods' files in one
# request by naming the same field ten times. Generated clients need a fixed document, hence the
# fixed number of slots.
query QueryModFilesOfTenMods(
    $modId0: ID!, $gameId0: ID!,
    $modId1: ID!, $gameId1: ID!,
    $modId2: ID!, $gameId2: ID!,
    $modId3: ID!, $gameId3: ID!,
    $modId4: ID!, $gameId4: ID!,
    $modId5: ID!, $gameId5: ID!,
    $modId6: ID!, $gameId6: ID!,
    $modId7: ID!, $gameId7: ID!,
    $modId8: ID!, $gameId8: ID!,
    $modId9: ID!, $gameId9: ID!
) {
    files0: modFiles(modId: $modId0, gameId: $gameId0) { ...ModFile }
    files1: modFiles(modId: $modId1, gameId: $gameId1) { ...ModFile }
    files2: modFiles(modId: $modId2, gameId: $gameId2) { ...ModFile }
    files3: modFiles(modId: $modId3, gameId: $gameId3) { ...ModFile }
    files4: modFiles(modId: $modId4, gameId: $gameId4) { ...ModFile }
    files5: modFiles(modId: $modId5, gameId: $gameId5) { ...ModFile }
    files6: modFiles(modId: $modId6, gameId: $gameId6) { ...ModFile }
    files7: modFiles(modId: $modId7, gameId: $gameId7) { ...ModFile }
    files8: modFiles(modId: $modId8, gameId: $gameId8) { ...ModFile }
    files9: modFiles(modId: $modId9, gameId: $gameId9) { ...ModFile }
}

query QueryCollectionId($collectionSlug: String!) {
    collection(slug: $collectionSlug) {
        id
        slug
    }
}

query QueryCollectionRevision($collectionSlug: String!, $revisionNumber: Int!)
{
    collectionRevision(slug: $collectionSlug, revision: $revisionNumber, viewAdultContent: true)
    {
        ...CollectionRevision
    }
}

query QueryCollectionRevisionDownloadLink($collectionSlug: String!, $revisionNumber: Int!)
{
    collectionRevision(slug: $collectionSlug, revision: $revisionNumber, viewAdultContent: true)
    {
        downloadLink
    }
}

query QueryCollectionRevisionNumbers($collectionSlug: String!, $gameDomainName: String!)
{
    collection(slug: $collectionSlug, domainName: $gameDomainName, viewAdultContent: true)
    {
        id,

        revisions {
            id,
            revisionNumber,
            ...CollectionRevisionStatus
        }
    }
}

query QueryModsRequiring($ids: [CompositeIdInput!]!, $modCount: Int!, $count: Int!, $offset: Int!)
{
    legacyMods(ids: $ids, count: $modCount)
    {
        nodes
        {
            modId
            gameId
            modRequirements
            {
                modsRequiringThisMod(count: $count, offset: $offset)
                {
                    totalCount
                    nodes
                    {
                        modId
                        gameId
                        modName
                    }
                }
            }
        }
    }
}

query QueryModRequirementDetails($ids: [CompositeIdInput!]!, $modCount: Int!, $requirementCount: Int!)
{
    legacyMods(ids: $ids, count: $modCount)
    {
        nodes
        {
            modId
            gameId
            name
            status
            modCategory
            {
                name
            }
            modRequirements
            {
                nexusRequirements(count: $requirementCount)
                {
                    nodes
                    {
                        modId
                        gameId
                        modName
                        externalRequirement
                    }
                }
            }
        }
    }
}

query QueryModRequirements($ids: [CompositeIdInput!]!, $modCount: Int!, $requirementCount: Int!)
{
    legacyMods(ids: $ids, count: $modCount)
    {
        nodes
        {
            modId
            gameId
            name
            status
            modRequirements
            {
                nexusRequirements(count: $requirementCount)
                {
                    nodes
                    {
                        modId
                        gameId
                        modName
                        externalRequirement
                        url
                        notes
                    }
                }
            }
        }
    }
}

query QueryModCategories($ids: [CompositeIdInput!]!, $modCount: Int!)
{
    legacyMods(ids: $ids, count: $modCount)
    {
        nodes
        {
            modId
            gameId
            modCategory
            {
                name
            }
        }
    }
}

query QueryModFileCategories($modId: ID!, $gameId: ID!)
{
    modFiles(modId: $modId, gameId: $gameId)
    {
        fileId
        category
        primary
        date
    }
}
